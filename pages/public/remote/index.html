<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>远程桌面</title>
  <link rel="stylesheet" href="/remote/connection.css">
  <script src="/remote/connection.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>远程桌面</h1>
      <p id="status" class="status" role="status">正在获取连接地址…</p>
    </header>
    <div class="connections">
      <section class="card" aria-labelledby="desktop-heading">
        <h2 id="desktop-heading">电脑远程</h2>
        <div class="command-box">
          <code id="command">—</code>
          <button id="copy" type="button" disabled>复制命令</button>
        </div>
      </section>
      <section class="card" aria-labelledby="mobile-heading">
        <h2 id="mobile-heading">手机远程</h2>
        <div class="actions">
          <button id="open-app" class="primary" type="button" disabled>用 Windows App 连接</button>
          <button id="copy-address" type="button" disabled>复制连接地址</button>
        </div>
        <p id="app-fallback" hidden><a id="app-link">再次打开 Windows App</a></p>
        <div class="downloads">
          <h3>下载 Windows App</h3>
          <div class="download-links">
            <a class="download-link" href="https://play.google.com/store/apps/details?id=com.microsoft.rdc.androidx">Google Play<span>官方商店</span></a>
            <a class="download-link" href="https://www.apkmirror.com/apk/microsoft-corporation/microsoft-remote-desktop-preview/windows-app-11-0-26101-14228-release/windows-app-11-0-26101-14228-android-apk-download/">下载 APK<span>APKMirror</span></a>
          </div>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
